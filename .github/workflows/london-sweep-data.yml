name: london sweep - scarica dati Nasdaq 1m
# Scarica lo storico a 1 minuto dell'indice Nasdaq-100 (Dukascopy, gratuito) per il backtest in
# backtest_london_sweep/ e lo committa nel branch che ha avviato il workflow.
# Gira sui runner di GitHub perché il feed Dukascopy non è raggiungibile dall'ambiente cloud di Claude.
# Nessun segreto, nessun servizio a pagamento.
on:
  push:
    paths:
      - .github/workflows/london-sweep-data.yml
      - backtest_london_sweep/scarica_dati.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: london-sweep-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scarica:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        anno: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: backtest_london_sweep }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pandas==2.2.3 pyarrow==18.1.0 requests==2.32.3
      - name: Scarica anno ${{ matrix.anno }}
        working-directory: backtest_london_sweep
        run: python scarica_dati.py ${{ matrix.anno }} | tail -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: dati-${{ matrix.anno }}
          path: backtest_london_sweep/dati/*.parquet
          retention-days: 7

  committa:
    needs: scarica
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: backtest_london_sweep/dati
          merge-multiple: true
      - name: Commit dei dati
        run: |
          ls -la backtest_london_sweep/dati
          git config user.name "london-sweep-data"
          git config user.email "london-sweep-data@users.noreply.github.com"
          git add backtest_london_sweep/dati/*.parquet
          git commit -q -m "Dati Nasdaq-100 1m (Dukascopy) per il backtest London sweep" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
