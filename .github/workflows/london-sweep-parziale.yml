name: london sweep - committa i dati gia' scaricati
# Prende gli anni già pronti (artifact "dati-<anno>") da una run in corso di london-sweep-data.yml
# e li committa subito, senza aspettare che finiscano tutti gli anni.
on:
  push:
    paths:
      - .github/workflows/london-sweep-parziale.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  RUN_ID: "45106881909"
jobs:
  committa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          pattern: dati-*
          path: backtest_london_sweep/dati
          merge-multiple: true
      - name: Commit dei dati
        run: |
          ls -la backtest_london_sweep/dati
          git config user.name "london-sweep-parziale"
          git config user.email "london-sweep-parziale@users.noreply.github.com"
          git add backtest_london_sweep/dati/*.parquet
          git commit -q -m "Dati Nasdaq-100 1m: anni gia' scaricati (parziale)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
