name: memecoin live probe
# Raccoglie campioni REALI e gratuiti dalla rete Solana (PumpPortal, RPC pubblico, Jito, Jupiter) e li salva come
# fixture JSON nel branch "live-fixtures": i parser on-chain vengono scritti e testati su questi dati reali.
# Sola lettura: nessuna transazione firmata o inviata.
on:
  workflow_dispatch:
    inputs:
      only_ws:
        description: "solo la sonda WebSocket"
        type: boolean
        default: false
      chain_check:
        description: "verifica le classi on-chain del bot sulla rete reale (stream, sicurezza, wallet, costi)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: live-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: memecoin-intelligence/backend }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Chain check (the bot's own classes on the real network)
        if: ${{ inputs.chain_check }}
        run: |
          pip install -q -e memecoin-intelligence/backend
          python memecoin-intelligence/backend/scripts/chain_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pip install "httpx>=0.27" "websockets>=12" "solders>=0.21"
        if: ${{ !inputs.chain_check }}
      - name: Probe
        if: ${{ !inputs.only_ws && !inputs.chain_check }}
        run: python memecoin-intelligence/backend/scripts/live_probe.py /tmp/fixtures
      - name: Probe 2 - free real-time trades from the public Solana WebSocket
        if: ${{ !inputs.chain_check }}
        run: python memecoin-intelligence/backend/scripts/ws_probe.py /tmp/fixtures
      - name: Publish fixtures to the live-fixtures branch
        if: ${{ always() && !inputs.chain_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/fixtures
          git init -q -b live-fixtures
          git config user.name "memecoin-bot"
          git config user.email "memecoin-bot@users.noreply.github.com"
          printf '# live-fixtures\n\nCampioni reali raccolti da memecoin-live-probe (sola lettura). Usati per testare i parser.\n' > README.md
          git add -A
          git commit -q -m "live probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-fixtures
