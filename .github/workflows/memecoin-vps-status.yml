name: memecoin VPS status
# Sola lettura: legge la dashboard pubblica della VPS (porta 8080, gli stessi dati paper che erano su
# GitHub Pages) e ne stampa un riepilogo. Non modifica nulla. L'IP viene letto dall'API Hetzner.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Find the VPS
        id: vps
        run: |
          ip=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?name=memecoin-bot" \
            | python3 -c "import sys,json; s=json.load(sys.stdin)['servers']; print(s[0]['public_net']['ipv4']['ip'] if s else '')")
          [ -n "$ip" ] || { echo "::error::nessun server memecoin-bot su Hetzner"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Bot status (read-only)
        env:
          IP: ${{ steps.vps.outputs.ip }}
        run: |
          mkdir -p /tmp/d
          for f in meta overview positions logs signals scanner lab system experiments research launches; do
            curl -fsS -m 20 "http://$IP:8080/data/$f.json" -o "/tmp/d/$f.json" || echo "{}" > "/tmp/d/$f.json"
          done
          # details of the highest-scoring tokens (why they were or were not bought)
          python3 -c "import json; [print(t['address']) for t in sorted(json.load(open('/tmp/d/scanner.json')).get('tokens', []), key=lambda t: -(t.get('score') or 0))[:8]]" \
            | while read -r a; do mkdir -p /tmp/d/tokens; curl -fsS -m 20 "http://$IP:8080/data/tokens/$a.json" -o "/tmp/d/tokens/$a.json" || true; done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime, timezone
          d = {f: json.load(open(f"/tmp/d/{f}.json")) for f in ("meta", "overview", "positions", "logs", "signals", "scanner", "lab",
                                                               "system", "experiments", "research", "launches")}
          gen = d["meta"].get("generated_at")
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(gen.replace("Z", "+00:00"))).total_seconds() if gen else None
          ov = d["overview"]; s = ov.get("summary", {}); w = ov.get("worker", {})
          print(f"## Stato VPS ({datetime.now(timezone.utc):%Y-%m-%d %H:%M} UTC)\n")
          print(f"- dati aggiornati {age:.0f} s fa" if age is not None else "- dati: NON DISPONIBILI")
          print(f"- worker attivo: {w.get('worker_alive')} · ultimo ciclo: {w.get('last_cycle')} · token monitorati: {w.get('tracked')} · registrati: {ov.get('tokens_recorded')}")
          print(f"- modalità: {s.get('mode')} · pausa: {s.get('paused')} · kill switch: {s.get('kill_switch')} · PumpPortal: {w.get('pumpportal_connected')}")
          print(f"- Telegram: inviati {w.get('telegram_sent')} · falliti {w.get('telegram_failed')} · ultimo errore: {w.get('telegram_last_error')}")
          print(f"- Jupiter: {'chiave attiva (1 richiesta/s)' if w.get('jupiter_key') else 'senza chiave (0,5 richieste/s)'}")
          eq = s.get("equity_sol") or 0; eur = s.get("sol_eur") or 0
          print(f"- capitale: {eq:.4f} SOL (≈ {eq*eur:.2f} €) · liquido {s.get('cash_sol', 0):.4f} · investito {s.get('invested_sol', 0):.4f} · ROI {100*(s.get('roi') or 0):+.2f}%")
          print(f"- operazioni chiuse: {s.get('total_trades')} · aperte: {s.get('open_positions')} · win rate: {s.get('win_rate')} · drawdown: {100*(s.get('drawdown') or 0):.1f}%\n")
          print("### Fonti dati")
          for k, v in (w.get("sources") or {}).items():
              print(f"- {k}: {'ok' if v.get('ok') else 'KO — ' + str(v.get('error'))} ({v.get('at')})")
          print("\n### Posizioni")
          for p in d["positions"].get("positions", [])[:15]:
              print(f"- {p.get('status')} {p.get('symbol')} [{p.get('strategy')}] puntata {p.get('stake_sol')} SOL · "
                    f"P&L {p.get('pnl_sol')} SOL ({100*(p.get('return_pct') or 0):+.1f}%) · aperta {p.get('opened_at')} · uscita: {p.get('exit_reason')}")
          print("\n### Ultimi segnali")
          for g in d["signals"].get("signals", [])[:10]:
              print(f"- {g.get('created_at')} {g.get('symbol')} [{g.get('strategy')}] score {g.get('score')} → {g.get('status')} {g.get('rejection') or ''}")
          import os
          lab = d["lab"]; ls = lab.get("summary") or {}
          print("\n### Laboratorio (senza limiti)")
          if ls:
              le = ls.get("equity_sol") or 0
              print(f"- attivo dal {lab.get('started_at')} · saldo virtuale {le:.4f} SOL · ROI {100*(ls.get('roi') or 0):+.2f}% · "
                    f"chiuse {ls.get('total_trades')} · aperte {ls.get('open_positions')} · win rate {ls.get('win_rate')} · "
                    f"drawdown max {100*(ls.get('max_drawdown') or 0):.1f}%")
              for r in lab.get("by_strategy", []):
                  print(f"  - {r['strategy']}: chiuse {r['trades']} (vinte {r['wins']}, perse {r['losses']}) · aperte {r['open']} · "
                        f"win rate {r['win_rate']} · P/L {r['pnl_sol']:+.4f} SOL · media {r['avg_return']}")
              st = lab.get("stats") or {}
              print(f"  - ultimo controllo: {lab.get('last_scan_at')} · segnali ricevuti: {st.get('signals', 0)} "
                    f"{st.get('by_strategy', {})} · ultimo segnale: {st.get('last_signal')} {st.get('last_signal_at')}")
              for p in (lab.get("positions") or [])[:20]:
                  print(f"    · {p.get('status')} {p.get('symbol')} [{p.get('strategy')}] {p.get('opened_at')} → {p.get('closed_at')} · "
                        f"ingresso {p.get('entry_price')} · puntata {p.get('stake_sol')} · costo {p.get('cost_sol')} · "
                        f"P/L {p.get('pnl_sol')} ({p.get('return_pct')}) · durata {p.get('duration_min')} · uscita: {p.get('exit_reason')}")
              if lab.get("skipped"):
                  print(f"  - segnali non simulabili: {lab['skipped']}")
          else:
              print("- dati del Laboratorio non ancora pubblicati")
          sy = d["system"]
          print("\n### Dati on-chain gratuiti (stream blockchain + RPC)")
          if sy:
              cs = sy.get("chain_stream") or {}
              lt = sy.get("launch_tracker") or {}
              rpc = sy.get("rpc") or {}
              print(f"- stream: connesso={cs.get('connected')} · messaggi {cs.get('messages')} · operazioni decodificate {cs.get('trades')} · "
                    f"lanci {cs.get('creates')} · fallite scartate {cs.get('skipped_failed')} · riconnessioni {cs.get('reconnects')} · "
                    f"errori handler {cs.get('handler_errors')} · ultimo errore {cs.get('last_error')}")
              print(f"- lanci: ultima ora {lt.get('launches_1h')} · 24 h {lt.get('launches_24h')} · in memoria {lt.get('in_memory')} · "
                    f"interruzioni 24 h {lt.get('gaps_24h')} · gap aperto {lt.get('stream_gap_open')}")
              print(f"- RPC: chiamate {rpc.get('calls')} · cache {rpc.get('cache_hits')} · rinviate per budget {rpc.get('budget_refused')} · "
                    f"fallite {rpc.get('failed')} · endpoint {rpc.get('endpoints')}")
              print(f"  - per metodo: {rpc.get('by_method')} · ultimi errori: {rpc.get('last_errors')}")
              print(f"- on-chain: {sy.get('onchain')} · wallet {sy.get('wallets')}")
              print(f"- costi di rete misurati: {sy.get('network_costs')} · in uso {sy.get('costs_in_use')}")
              print(f"- dataset: {sy.get('dataset')} · database {sy.get('db_size_bytes')} byte")
              for e in (sy.get("recent_errors") or [])[:8]:
                  print(f"  - errore {e.get('ts')} {e.get('category')}: {e.get('message')}")
          else:
              print("- non ancora pubblicati")
          print("\n### Esperimenti shadow")
          for e in (d["experiments"].get("experiments") or []):
              es = e.get("summary") or {}
              g = e.get("gate") or {}
              print(f"- {e.get('mode')} ({e.get('title')}): chiuse {es.get('total_trades')} · aperte {es.get('open_positions')} · "
                    f"ROI {100*(es.get('roi') or 0):+.2f}% · segnali {(e.get('stats') or {}).get('signals')} · scartati {e.get('skipped')} · {g.get('status')}")
          r = (d["research"].get("report") or {})
          print(f"\n### Ricerca\n- {r.get('verdict')} · osservazioni usabili {r.get('rows_usable')} · tassi base {r.get('base_rates')} · dataset {d['research'].get('dataset')}")
          print(f"- rapporto del {r.get('generated_at')} · orizzonte {r.get('horizon')} · osservazioni totali {r.get('rows_total')}")
          for k, v in (r.get("indices") or {}).items():
              print(f"- indice {k}: {v}")
          for k, v in (r.get("walk_forward") or {}).items():
              print(f"- walk-forward {k}: verdetto {v.get('verdict')} · AUC media {v.get('mean_auc')} · batte il tasso base {v.get('beats_base_rate_folds')}")
          for k, v in (r.get("shadow_rules") or {}).items():
              print(f"- regola shadow {k}: {v}")
          feats = [f for f in (r.get("features") or []) if isinstance(f, dict)]
          for tgt in ("hit_2x_first", "rug_60m"):
              ranked = sorted((f for f in feats if f.get(tgt)), key=lambda f: -abs((f[tgt].get("auc") or 0.5) - 0.5))
              print(f"- caratteristiche più legate a {tgt} (AUC, IC 95%, informativa):")
              for f in ranked[:12]:
                  x = f[tgt]
                  print(f"    {f['feature']}: AUC {x.get('auc')} IC {x.get('ci')} informativa={x.get('informative')} n={f.get('n')}")
          es = d["research"].get("event_study") or {}
          print(f"\n### Diario e studio degli eventi\n- journal: {(w.get('journal') or {})}")
          print(f"- studio del {es.get('generated_at')} · esclusi {es.get('skipped')} · gruppi piccoli {es.get('small_groups')}")
          for g in es.get("events") or []:
              print(f"    {g.get('event')}: n={g.get('n')} età {g.get('age_median_min')} min · mediana 60m {g.get('end_median_pct')}% · "
                    f"+100% {g.get('p_up_100')} · -50% {g.get('p_down_50')} · diploma {g.get('p_migrated')} · confronto {g.get('baseline')}")
          for h, b in (es.get("baseline") or {}).items():
              print(f"    momento qualsiasi {h}: {b}")
          cp = d["research"].get("copy") or {}
          print(f"\n### Esperimento di copia dei wallet\n- registro: {cp.get('ledger')}")
          print(f"- scelta: {({k: v for k, v in (cp.get('leaders') or {}).items() if k != 'leaders'})} · primi 5: {((cp.get('leaders') or {}).get('leaders') or [])[:5]}")
          for v in cp.get("live") or []:
              print(f"- dal vivo {v}")
          for k, v in (((cp.get("report") or {}).get("variants")) or {}).items():
              print(f"- {k}: {v}")
          rl = d["research"].get("rules_lab") or {}
          print(f"\n### Laboratorio delle regole (registrate {rl.get('registered_at')}, righe {rl.get('rows')})")
          for x in rl.get("results") or []:
              print(f"- {x.get('rule')} {x.get('exit')}: fuori campione n={x.get('n_oos')} media {x.get('mean_oos_pct')}% IC {x.get('ci_oos')} · "
                    f"in campione n={x.get('n_in_sample')} media {x.get('mean_in_sample_pct')}% · {x.get('verdict')}")
          print("\n### Ultimi lanci pump.fun visti dallo stream")
          for l in (d["launches"].get("launches") or [])[:10]:
              t5 = l.get("t5") or {}
              print(f"- {l.get('created_at')} {l.get('symbol')} mayhem={l.get('mayhem')} fonte={l.get('source')} · stats {l.get('stats')} · "
                    f"t+5m acquirenti {t5.get('unique_buyers')} pressione {t5.get('buy_pressure')} rischio {t5.get('risk')} opportunità {t5.get('opportunity')} esito {t5.get('labels')}")
          print("\n### Token con il punteggio più alto")
          for t in sorted(d["scanner"].get("tokens", []), key=lambda t: -(t.get("score") or 0))[:8]:
              age_h = t.get("age_hours")  # not "age": that one is the data freshness checked at the end
              print(f"- **{t.get('symbol')}** score {t.get('score')} ({t.get('label')}) · rischio {t.get('risk')} · stato {t.get('status')} · "
                    f"età {age_h:.1f} h · liquidità {t.get('liquidity_usd')} $ · 1h {t.get('change_h1')}% · copertura dati {t.get('coverage')} · "
                    f"ultimo segnale: {t.get('signal')} · esclusione: {t.get('exclusion')}" if age_h is not None else f"- {t.get('symbol')} score {t.get('score')} stato {t.get('status')} esclusione {t.get('exclusion')}")
              fp = f"/tmp/d/tokens/{t['address']}.json"
              if os.path.exists(fp):
                  td = json.load(open(fp)); sc = td.get("score") or {}
                  print(f"    - candele 1m disponibili: {len(td.get('candles') or [])} · controlli in attesa: {sc.get('pending_checks')} · "
                        f"esclusioni per il trading: {sc.get('exclusion_reasons')}")
                  print(f"    - rischi: {(sc.get('risks') or [])[:3]}")
                  for g in (td.get("signals") or [])[:3]:
                      print(f"    - segnale {g.get('created_at')} [{g.get('strategy')}] {g.get('status')} {g.get('rejection') or ''}")
          print("\n### Ultimi eventi")
          for e in d["logs"].get("events", [])[:25]:
              print(f"- {e.get('ts')} {e.get('level')} {e.get('category')}: {e.get('message')}")
          if age is None or age > 600 or not w.get("worker_alive"):
              raise SystemExit("ATTENZIONE: dati vecchi o worker non attivo")
          PY
