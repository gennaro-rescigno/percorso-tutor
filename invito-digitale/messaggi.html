<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I tuoi messaggi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2D8D4">
<!-- config.js sta qui in alto perché decide il tema prima che la pagina si disegni -->
<script src="config.js"></script>
<script>document.documentElement.dataset.tema = (window.CONFIG && window.CONFIG.tema) || "cipria";</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Parisienne&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Monoton&display=swap">
<link rel="stylesheet" href="assets/css/stile.css">
<link rel="stylesheet" href="assets/css/discoteca.css">
</head>

<body>
<div class="fondo" aria-hidden="true"></div>
<canvas id="glitter" aria-hidden="true"></canvas>
<canvas id="rose" aria-hidden="true"></canvas>

<!-- ============ 1. LA SERRATURA ============ -->
<section class="serratura" id="serratura">
  <form class="carta serratura-carta" id="moduloCodice" novalidate>
    <p class="occhiello">Solo per te</p>
    <h1 class="titolo-sezione" id="titoloSerratura">I tuoi messaggi</h1>
    <p class="testo-tenue" style="margin:0.6rem 0 1.4rem">
      Le persone che ti vogliono bene ti hanno scritto. Nessuno ha lasciato il proprio nome.
    </p>

    <div class="campo">
      <label for="codice">Il tuo codice</label>
      <input type="password" id="codice" name="codice" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>

    <p class="avviso campo-staccato" id="avvisoCodice" role="alert" hidden></p>

    <div class="piede-modulo">
      <button class="bottone" id="apri" type="submit">Apri le lettere</button>
    </div>
  </form>
</section>

<!-- ============ 2. LO SCRIGNO ============ -->
<main class="scrigno" id="scrigno" hidden>

  <section class="sezione" style="padding-top:1.5rem">
    <p class="occhiello">Hanno scritto per te</p>
    <p class="conta-messaggi" id="quanti">—</p>
    <div class="filo" aria-hidden="true"><span>&#9670;</span></div>
  </section>

  <!-- se i messaggi sono ancora sigillati -->
  <section class="sezione" id="ancoraChiusi" hidden>
    <h2 class="titolo-sezione">Ancora chiuse</h2>
    <p class="testo-tenue" id="testoChiusura"></p>
    <div class="sigilli" id="sigilli" aria-hidden="true"></div>
  </section>

  <!-- i messaggi -->
  <section class="sezione" id="sezioneMessaggi" hidden>
    <div class="pila" id="pilaMessaggi"></div>
  </section>

  <!-- le conferme di presenza -->
  <section class="sezione" id="sezioneConferme" hidden>
    <div class="filo" aria-hidden="true"><span>&#9670;</span></div>
    <p class="occhiello">Chi c'era</p>
    <h2 class="titolo-sezione">Le conferme</h2>
    <p class="testo-tenue" id="riassuntoConferme"></p>
    <div class="avvolgi-tabella">
      <table class="tabella-conferme">
        <thead>
          <tr><th>Nome</th><th>C'&egrave;</th><th>Ospiti</th><th>Allergie</th><th>Note</th></tr>
        </thead>
        <tbody id="corpoConferme"></tbody>
      </table>
    </div>
  </section>

  <footer class="piede">
    <div class="piede-modulo">
      <button class="bottone bottone-lieve" id="chiudi" type="button">Chiudi</button>
    </div>
  </footer>
</main>

<script src="assets/js/sfondo.js"></script>
<script src="assets/js/dati.js"></script>
<script src="assets/js/messaggi.js"></script>
</body>
</html>
