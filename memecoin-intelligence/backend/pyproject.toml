[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memecoin-intelligence"
version = "0.1.0"
description = "Memecoin intelligence, scoring, backtesting and paper trading system (Solana first)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=12",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Only needed to sign real transactions. Never installed by default.
live = ["solders>=0.21", "base58>=2.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
mci = "mci.cli:main"

[tool.setuptools.packages.find]
include = ["mci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
