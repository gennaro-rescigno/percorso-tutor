# Single-VM deployment (any Linux VPS / Oracle Cloud). Automatic install: deploy/vps.sh install
# Manual: cp .env.example .env && edit .env && docker compose up -d --build
# The HTTPS dashboard (caddy) runs only with the "web" profile: COMPOSE_PROFILES=web in .env (needs DOMAIN).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: mci
      POSTGRES_USER: mci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mci -d mci"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  worker:
    build: .
    command: ["mci", "worker"]
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      MCI_DATABASE_URL: postgresql+psycopg://mci:${POSTGRES_PASSWORD}@db:5432/mci
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      disable: true
    volumes:
      - ./reports:/app/reports
      - ./data:/app/backend/data
    # Live trading keypair (ONLY if you ever enable live mode): mount read-only from outside the repo
    # (add under volumes:) - /home/ubuntu/secrets/trading-wallet.json:/run/secrets/wallet.json:ro
    deploy:
      resources:
        limits: { memory: 1g }

  api:
    build: .
    command: ["mci", "api"]
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      MCI_DATABASE_URL: postgresql+psycopg://mci:${POSTGRES_PASSWORD}@db:5432/mci
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./data:/app/backend/data
    expose: ["8000"]
    deploy:
      resources:
        limits: { memory: 768m }

  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["web"]
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  # read-only public dashboard (paper data only, no login, no secrets) on http://<server-ip>:8080
  publisher:
    build: .
    command: ["mci", "publish-static", "--out", "/srv/site", "--every", "60"]
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      MCI_DATABASE_URL: postgresql+psycopg://mci:${POSTGRES_PASSWORD}@db:5432/mci
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      disable: true
    volumes:
      - public_site:/srv/site
    deploy:
      resources:
        limits: { memory: 512m }

  public:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["8080:80"]
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - public_site:/srv/site:ro
    depends_on: [publisher]

  backup:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  public_site:
  caddy_data:
  caddy_config:
