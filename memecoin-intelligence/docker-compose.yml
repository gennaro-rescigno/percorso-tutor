# Single-VM deployment (Oracle Cloud Always Free / any Linux VM).
# Usage: cp .env.example .env && edit .env && docker compose up -d --build
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mci
      POSTGRES_USER: mci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mci -d mci"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  worker:
    build: .
    command: ["mci", "worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      MCI_DATABASE_URL: postgresql+psycopg://mci:${POSTGRES_PASSWORD}@db:5432/mci
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      disable: true
    volumes:
      - ./reports:/app/reports
    # Live trading keypair (ONLY if you ever enable live mode): mount read-only from outside the repo
    # (add under volumes:) - /home/ubuntu/secrets/trading-wallet.json:/run/secrets/wallet.json:ro
    deploy:
      resources:
        limits: { memory: 1g }

  api:
    build: .
    command: ["mci", "api"]
    restart: unless-stopped
    env_file: .env
    environment:
      MCI_DATABASE_URL: postgresql+psycopg://mci:${POSTGRES_PASSWORD}@db:5432/mci
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]
    deploy:
      resources:
        limits: { memory: 768m }

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. 1-2-3-4.sslip.io or a DuckDNS name)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  backup:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
