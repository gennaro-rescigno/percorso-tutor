# Netlify pubblica SOLO la cartella "pubblico".
# Tutto il resto (registro.md, impostazioni.json, gli strumenti, lo script
# Google) resta nel repo privato e non finisce mai online.
[build]
  publish = "pubblico"
  command = ""

# I motori di ricerca non devono nemmeno provarci.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
