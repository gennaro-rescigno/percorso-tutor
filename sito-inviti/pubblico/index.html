<title>Inviti</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #14100F;
    color: #8A7F79;
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
    padding: 2rem;
  }
  p { max-width: 24rem; line-height: 1.7; font-size: 0.95rem; }
  .segno { display: block; font-size: 1.6rem; margin-bottom: 1rem; opacity: 0.5; }
</style>
</head>
<body>
  <p>
    <span class="segno" aria-hidden="true">&#9670;</span>
    Ogni invito ha il suo indirizzo.<br>
    Se ne aspetti uno, ti sarà arrivato per messaggio.
  </p>
